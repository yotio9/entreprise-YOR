services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    command: >
      sh -ec "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn yorwani.wsgi:application --bind 0.0.0.0:8000
      --workers 2 --timeout 60"
    volumes:
      - yorwani_media:/app/media
      - yorwani_backups:/app/.private_backups
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_database"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      JUMIA_AGENT_ENABLED: "${JUMIA_AGENT_ENABLED:-0}"
      JUMIA_AGENT_MODE: simulation
    command: ["python", "manage.py", "run_jumia_agent"]
    profiles: ["agent"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - yorwani_media:/app/media
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:?Set SITE_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - yorwani_media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  yorwani_media:
  yorwani_backups:
  caddy_data:
  caddy_config:
